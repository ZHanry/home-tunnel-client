# 仅供隔离命名空间的验收构建；仍须使用测试机，不能计作原交付包实机通过。
# 私网地址及全零公钥为合成占位值，不对应任何真实部署；默认不访问公网。
[brand]
app_name = "HomeDesk"
executable_name = "homedesk"
package_name = "homedesk"
# 保留现用测试程序的配置与设备身份，界面不显示此内部名称。
config_namespace = "HomeDeskAcceptance"

[server]
host = "192.168.50.10"
relay_host = ""
key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

[net]
mode = "lan_only"
whitelist_cidr = "192.168.50.0/24"
source_cidr = ""

[console]
enabled = false
trusted_path = false
