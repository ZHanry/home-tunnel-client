<section id="login" class="login-layout"><div class="login-story"><p class="eyebrow">HOME TUNNEL / DESKTOP</p><h1 data-i18n="welcomeTitle"></h1><p data-i18n="welcomeDetail"></p><ol class="login-steps"><li><b>01</b><span data-i18n="stepSignIn"></span></li><li><b>02</b><span data-i18n="stepService"></span></li><li><b>03</b><span data-i18n="stepShare"></span></li></ol></div><div class="login-panel"><h2 data-i18n="connectComputer"></h2><form id="login-form">

<section id="home" class="hidden"><div class="workspace-grid"><aside class="machine-panel"><p class="eyebrow" data-i18n="thisComputer"></p><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><h2 id="machine-name"></h2><p class="muted" id="machine-version"></p><p class="scope-note" data-i18n="scopeNote"></p><button class="secondary" id="console" data-i18n="console"></button><button class="secondary" id="settings-open" data-i18n="settings"></button><p class="muted" id="status" role="status"></p></aside><div class="service-workspace"><div class="workspace-title"><div><p class="eyebrow">WORKSPACE</p><h1 data-i18n="myServices"></h1></div><div class="row"><button class="secondary" id="refresh" data-i18n="sync"></button><button id="add" data-i18n="add"></button></div></div><div class="summary-strip"><div><small data-i18n="allServices"></small><strong id="count-total">0</strong></div><div><small data-i18n="online"></small><strong id="count-online">0</strong></div><div><small data-i18n="paused"></small><strong id="count-paused">0</strong></div></div><div class="filter-bar"><div><label for="service-search" data-i18n="searchServices"></label><input id="service-search" type="search"></div><div><label for="service-filter" data-i18n="statusFilter"></label><select id="service-filter"><option value="all" data-i18n="all"></option><option value="online" data-i18n="online"></option><option value="paused" data-i18n="paused"></option></select></div></div><div class="row"><span id="batch-count" role="status">0 / 50</span><button id="batch-pause" class="secondary" data-i18n="batchPause" disabled></button><button id="batch-resume" class="secondary" data-i18n="batchResume" disabled></button></div><pre id="batch-results" role="status" style="white-space:pre-wrap"></pre><div id="connections" class="service-list"></div><p class="muted" id="update"></p></div></div></section>
<section id="settings" class="settings-panel hidden"><p class="eyebrow">PREFERENCES</p><h1 data-i18n="settings"></h1><div class="settings-card"><h3 data-i18n="server"></h3><div class="settings-value" id="settings-server"></div><p data-i18n="scopeNote"></p><button class="secondary" id="settings-back" data-i18n="backServices"></button></div><div class="settings-card"><h3 data-i18n="metadata"></h3><label for="device-tags" data-i18n="tags"></label><input id="device-tags" maxlength="396"><label class="check"><input id="device-favorite" type="checkbox"><span data-i18n="favorite"></span></label><button id="metadata-save" data-i18n="saveMetadata" disabled></button></div><div class="settings-card" id="remote-host-card"><h3>远程协助 / Remote assistance</h3><p class="muted">仅通过 UDP 直连。这台电脑每次只接受一个控制端；配对与会话均由你在本机批准。</p><p id="rd-host-status" role="status">正在检查本机能力…</p><p id="rd-host-detail" class="muted" style="overflow-wrap:anywhere"></p><div class="row"><button type="button" id="rd-host-enable" disabled>允许远程连接 / Enable</button><button type="button" id="rd-host-disable" class="secondary" disabled>关闭远程连接 / Disable</button><button type="button" id="rd-host-stop" class="danger" disabled>立即断开 / Disconnect</button></div><form id="rd-host-enroll" class="hidden"><p>首次启用需要本设备所属账号验证。密码和动态码仅用于本次登记。</p><label for="rd-host-user">账号 / Account</label><input id="rd-host-user" autocomplete="username" maxlength="128" required><label for="rd-host-password">密码 / Password</label><input id="rd-host-password" type="password" autocomplete="current-password" maxlength="512" required><label for="rd-host-mfa">动态码或恢复码 / MFA code</label><input id="rd-host-mfa" autocomplete="one-time-code" maxlength="128"><button id="rd-host-trust-load" type="button" class="secondary">查看服务器身份 / Verify server</button><pre id="rd-host-trust" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><label class="check"><input type="checkbox" id="rd-host-trust-confirm"><span>我已核对服务器身份，信任此密钥 / Trust this server identity</span></label><button id="rd-host-enroll-submit" type="submit" disabled>登记本机 / Enroll</button></form><div id="rd-host-pending"></div><div id="rd-host-grants"></div><div id="rd-host-files"></div><p id="rd-host-error" class="error" role="alert"></p></div><div class="settings-card"><h3 data-i18n="sessionTitle"></h3><p data-i18n="sessionHelp"></p><div class="row"><button class="danger" id="logout" data-i18n="logout"></button><button class="secondary" id="quit-home" data-i18n="quitApp"></button></div></div><div class="settings-card"><h3>诊断 / Diagnostics</h3><p class="muted">检查 DNS、HTTPS、FRPS 与本地服务。导出内容不含凭据、地址或原始日志。</p><div class="row"><button id="doctor-run" class="secondary" type="button">运行诊断 / Run checks</button><button id="support-bundle" class="secondary" type="button">导出诊断包 / Export bundle</button></div><pre id="doctor-result" class="muted" role="status"></pre></div><p id="settings-error" class="error" role="alert"></p></section>
<section id="editor" class="editor-panel hidden"><p class="eyebrow" data-i18n="publishService"></p><form id="editor-form">

      <div id="web-address"><label for="subdomain" data-i18n="subdomain"></label><input id="subdomain" required>
      <p class="muted" id="availability"></p>
      <div id="suggestions"></div></div>
      </fieldset><fieldset><legend data-i18n="destination"></legend><p class="muted" data-i18n="hostHelp"></p><div id="web-scheme"><label for="scheme" data-i18n="scheme"></label>

      <label class="check"><input id="enabled" type="checkbox" checked><span data-i18n="enabled"></span></label>
      </fieldset></div><p class="error" id="edit-error" role="alert"></p>
      <div class="row">
        <button type="submit" id="save" data-i18n="save"></button>

      </div>
    </form></section></main><script src="/desktop.js" defer></script></body></html>
