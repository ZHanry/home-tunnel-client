name: Release client
'on':
  push:
    tags:
    - v*-rc.*
    - v*-RC*
    - v[0-9]*.[0-9]*.[0-9]*
permissions:
  contents: write
  checks: read
  actions: read
  id-token: write
  attestations: write
jobs:
  release:
    name: Publish verified nestlink products
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - id: metadata
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/homedesk-release.py metadata
    - name: Download exact main-build artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN: ${{ steps.metadata.outputs.build-run }}
      run: |-
        gh run download "$BUILD_RUN" -n homedesk-windows -D imported/windows
        mkdir -p products material-input
        cp imported/windows/products/* products/
        cp -R imported/windows/material-input/. material-input/
        for target in linux-x64 linux-arm64; do
          gh run download "$BUILD_RUN" -n "nestlink-$target" -D "imported/$target"
          cp imported/$target/products/* products/
          mkdir -p "material-input/$target"
          cp -R imported/$target/material-input/. "material-input/$target/"
        done
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - name: Bind native installers to source and seal five attachments
      env:
        VERSION: ${{ steps.metadata.outputs.version }}
      run: python3 scripts/homedesk-release.py pack --component client --input products --select "NestLink-Setup-$VERSION-x64.exe"
        --select "NestLink-Linux-$VERSION-x64.deb" --select "NestLink-Linux-$VERSION-arm64.deb" --evidence material-input
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: release-public/SHA256SUMS.txt
    - name: Publish verified product bytes
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/homedesk-release.py publish --input release-public
