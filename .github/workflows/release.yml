name: Release client
'on':
  workflow_dispatch:
    inputs:
      candidate:
        description: Build an untagged candidate without publishing
        type: boolean
        default: false
      revision:
        description: Candidate only - exact SHA on the dispatched branch
        type: string
        default: ''
      build_run_id:
        description: Publication only - accepted candidate run ID
        type: string
        default: ''
      artifact_id:
        description: Publication only - immutable candidate-assets artifact ID
        type: string
        default: ''
      artifact_sha256:
        description: Publication only - candidate artifact ZIP SHA-256
        type: string
        default: ''
      acceptance_revision:
        description: Publication only - reviewed hub main commit with all acceptance receipts
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: inputs.candidate
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/client-candidate.yml
    with:
      revision: ${{ inputs.revision }}
    secrets: inherit
  metadata:
    if: ${{ !inputs.candidate }}
    name: Validate accepted component tag and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 scripts/release.py metadata
  publish:
    if: ${{ !inputs.candidate }}
    name: Publish accepted original candidate bytes
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - name: Verify pinned candidate run, bytes, signatures and acceptance receipts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
        ARTIFACT_ID: ${{ inputs.artifact_id }}
        ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        ACCEPTANCE_REVISION: ${{ inputs.acceptance_revision }}
        VERSION: ${{ needs.metadata.outputs.version }}
      run: |
        set -euo pipefail
        python3 scripts/fetch-client-candidate.py --run-id "$BUILD_RUN_ID" --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" --revision "$GITHUB_SHA" --version "$VERSION" --acceptance-revision "$ACCEPTANCE_REVISION" --output candidate-download
        python3 scripts/stage-client-release.py --source candidate-download --output release --revision "$GITHUB_SHA" --version "$VERSION"
    - name: Seal and publish the verified original files
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        python3 scripts/release.py seal
        cosign sign-blob --yes --bundle release/SHA256SUMS.txt.sigstore.json release/SHA256SUMS.txt
        python3 scripts/release.py stable
    - name: Retain release verification evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-verification-evidence
        path: |
          release/*
          candidate-download/verification/*
        if-no-files-found: error
        retention-days: 90
