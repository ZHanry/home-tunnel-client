name: Recover exact v10.1 client source once
on:
  push:
    branches: [codex/windows-v10-1]
    paths: ['.github/workflows/recover-v101-client.yml']
permissions:
  contents: read
concurrency:
  group: recover-v101-client
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'ZHanry/home-tunnel-client' && github.ref == 'refs/heads/codex/windows-v10-1' && github.event_name == 'push' && github.event.before == '4c2cbfcc896d5939fa6641e2fff3ad8f0b80eb62'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Reconstruct only reviewed hashes and push this branch without force
        run: python3 -I .recovery/v10.1-client/recover.py
