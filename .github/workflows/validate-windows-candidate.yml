name: Validate sealed Windows candidate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/validate-windows-candidate.yml
      - scripts/validate-windows-candidate.py
      - scripts/test_windows_candidate_validation.py
      - tests/remote-native/final-candidate-10.1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Final Defender rescan and bounded native checks
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Check out validation helper separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
          persist-credentials: false
      - name: Check out immutable client source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ZHanry/home-tunnel-client
          ref: 9b3dbb751942fee040049f9901ea61e95e60c10c
          path: sources/client
          persist-credentials: false
      - name: Check out locked server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ZHanry/home-tunnel-server
          ref: 194ae805f3569dc16d94b7fda71367e5d68fdff5
          path: sources/server
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.13.12
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Check the wrapper under the pinned Windows Python
        shell: pwsh
        run: |
          python -m unittest discover -s qa/scripts -p test_windows_candidate_validation.py
          if ($LASTEXITCODE -ne 0) { throw 'Validation wrapper unit tests failed' }
          python -m py_compile qa/scripts/validate-windows-candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'Validation wrapper compilation failed' }
      - name: Verify original immutable candidate before executing its bytes
        shell: pwsh
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pin = Get-Content -Raw qa/tests/remote-native/final-candidate-10.1.json | ConvertFrom-Json
          if ($pin.revision -ne '9b3dbb751942fee040049f9901ea61e95e60c10c' -or $pin.server_revision -ne '194ae805f3569dc16d94b7fda71367e5d68fdff5' -or $pin.run_id -ne '36696397157' -or $pin.version -ne '10.1.0') { throw 'Candidate identity differs from this reviewed workflow' }
          python sources/client/scripts/fetch-client-candidate.py --run-id $pin.run_id --artifact-id $pin.artifact_id --artifact-sha256 $pin.artifact_sha256 --revision $pin.revision --version $pin.version --output verified-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Original candidate provenance verification failed' }
      - name: Rescan the exact post-seal Windows bytes with Defender
        shell: pwsh
        timeout-minutes: 18
        run: |
          python qa/scripts/validate-windows-candidate.py --phase rescan --client sources/client --server sources/server --verified verified-candidate --output defender-evidence --revision 9b3dbb751942fee040049f9901ea61e95e60c10c --server-revision 194ae805f3569dc16d94b7fda71367e5d68fdff5 --version 10.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Post-seal Defender rescan did not pass; inspect the separate scan evidence' }
      - name: Retain the new Defender receipt before optional native cases
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-final-defender-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            defender-evidence/
            verified-candidate/client-candidate-download.json
            verified-candidate/verification/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache-dependency-path: sources/client/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.19.0
      - name: Install locked test dependencies and Chromium
        shell: pwsh
        run: |
          pnpm --dir sources/client install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Client dependency installation failed' }
          pnpm --dir sources/server/control-center install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Server dependency installation failed' }
          pnpm --dir sources/client exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Playwright Chromium installation failed' }
      - name: Run two bounded real native cases against the unchanged worker
        shell: pwsh
        timeout-minutes: 25
        run: |
          python qa/scripts/validate-windows-candidate.py --client sources/client --server sources/server --verified verified-candidate --output native-evidence --revision 9b3dbb751942fee040049f9901ea61e95e60c10c --server-revision 194ae805f3569dc16d94b7fda71367e5d68fdff5 --version 10.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Native candidate validation did not pass; inspect the retained original reports' }
      - name: Retain package-bound raw reports without private fixture state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-final-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-evidence/
            verified-candidate/client-candidate-download.json
            verified-candidate/verification/
          if-no-files-found: error
          retention-days: 30
