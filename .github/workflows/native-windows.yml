name: Native Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-windows.yml'
      - 'scripts/build-native-windows.ps1'
      - 'scripts/build-remote-webrtc.py'
      - 'scripts/generate-remote-notices.py'
      - 'scripts/package-remote-sdk.py'
      - 'native/remote/**'
permissions:
  contents: read
jobs:
  core:
    name: Native media and descriptor safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Test core and private descriptor lifetimes
      run: |
        cmake -S native/remote -B outputs/native-core -DCMAKE_BUILD_TYPE=Debug -DHT_RD_SANITIZERS=ON
        cmake --build outputs/native-core --parallel 2
        ctest --test-dir outputs/native-core --output-on-failure
  native:
    needs: core
    runs-on: ${{ vars.WINDOWS_NATIVE_RUNNER || 'windows-2022' }}
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.26.6
    - name: Build the immutable native sources and verify authorization and input cleanup
      shell: pwsh
      run: .\scripts\build-native-windows.ps1
    - name: Verify actual worker IPC and desktop availability
      shell: pwsh
      run: |
        $env:HT_REMOTE_HOST_TEST_EXE = "$PWD/outputs/native-windows-build/home_tunnel_remote_host.exe"
        go test ./internal/remoteengine -v
        if ($LASTEXITCODE -ne 0) { throw 'Actual native worker IPC or interactive desktop probe failed' }
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: native-windows-candidate
        path: outputs/native-windows-build/*
        if-no-files-found: error
        retention-days: 14
