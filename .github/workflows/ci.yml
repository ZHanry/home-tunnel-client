name: Client CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Build HomeDesk Windows installer
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - &id002
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.0
        cache-dependency-path: go.sum
    - &id003
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.96.0
        components: rustfmt
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with: &id004
        channel: stable
        flutter-version: 3.24.5
        cache: true
    - &id005
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: D:/vcpkg
        vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
        vcpkgJsonGlob: client/vcpkg.json
        doNotCache: true
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      id: native-deps
      with:
        path: |-
          D:/vcpkg/installed
          D:/vcpkg/buildtrees
          D:/vcpkg/downloads
        key: homedesk-vcpkg-win2022-static-host-source-120deac-${{ hashFiles('client/vcpkg.json', 'client/res/vcpkg/**') }}
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          client/target
        key: homedesk-rust-win2022-1.96-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |-
          homedesk-rust-win2022-1.96-${{ hashFiles('client/Cargo.lock') }}-
          homedesk-rust-win2022-1.96-
    - name: Prepare locked native toolchain
      shell: pwsh
      run: .\build\ci\setup-windows.ps1
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: ${{ steps.native-deps.outputs.cache-hit != 'true' }}
      with:
        path: |-
          D:/vcpkg/installed
          D:/vcpkg/buildtrees
          D:/vcpkg/downloads
        key: ${{ steps.native-deps.outputs.cache-primary-key }}
    - name: Build native P2P client
      run: python build/ci/build-client.py --target win-x64 --config build/config.toml.example
    - name: Analyze and test the current Flutter product
      shell: pwsh
      run: |
        cd client/flutter
        flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
        if ($LASTEXITCODE -ne 0) { throw 'Dart errors' }
        flutter test --no-pub test/homedesk_devices_test.dart test/homedesk_dashboard_test.dart test/homedesk_advanced_test.dart test/homedesk_services_test.dart test/homedesk_mobile_test.dart
        if ($LASTEXITCODE -ne 0) { throw 'Widget tests failed' }
        cd ../..
        $env:HOMEDESK_TEST_OPENSSL = "C:/Program Files/Git/usr/bin/openssl.exe"
        foreach ($fixture in Get-ChildItem tests/dart/*.dart) {
          dart --packages=client/flutter/.dart_tool/package_config.json $fixture.FullName
          if ($LASTEXITCODE -ne 0) { throw "Portal/credential integration failed" }
        }
    - name: Build the current managed helper and installer
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force .downloads | Out-Null
        python build/tunnel/build-runtime.py --target win-x64
        if ($LASTEXITCODE -ne 0) { throw 'Managed helper failed' }
        $compilerLines = .\packaging\windows\install-inno-setup.ps1
        $compiler = ($compilerLines | Where-Object { $_ -like 'ISCC=*' }) -replace '^ISCC=', ''
        python scripts/test-homedesk-upgrade.py --iscc $compiler --evidence material-input/windows-upgrade.json
        if ($LASTEXITCODE -ne 0) { throw 'Upgrade preflight regression failed' }
        python scripts/package-homedesk-windows.py --iscc $compiler
        if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
        $version = (Get-Content -Raw compatibility.json | ConvertFrom-Json).version
        ./packaging/windows/test-homedesk-installer.ps1 -Installer "products/NestLink-Setup-$version-x64.exe"
    - name: Preserve corresponding source and native notices
      run: python scripts/collect-native-materials.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: homedesk-windows
        include-hidden-files: true
        path: |-
          products/*
          material-input/**
        if-no-files-found: error
        retention-days: 30
  cli:
    name: Current-source CLI and independent tunnel regression
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.0
        cache-dependency-path: go.sum
    - name: Test preserved tunneling and helper boundaries
      run: |-
        go test ./...
        python3 scripts/verify-frp-security.py
    - name: Package the five-platform CLI and original Agents
      run: python3 scripts/package-cli-bundle.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: homedesk-cli
        include-hidden-files: true
        path: |-
          products/*
          material-input/**
        if-no-files-found: error
  policy:
    name: P2P source and contract checks
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.96.0
        components: rustfmt
    - name: Validate strict P2P and retained packaging
      run: |-
        python3 scripts/check-repository.py
        python3 -m unittest discover -s tests -p 'test_*.py'
        rustc --test client/homedesk_build.rs -o /tmp/homedesk-brand
        /tmp/homedesk-brand
        rustc --test client/src/homedesk_net.rs -o /tmp/homedesk-network
        /tmp/homedesk-network
        rustc --edition=2021 --test client/src/homedesk_process.rs -o /tmp/homedesk-process
        /tmp/homedesk-process
        rustc --edition=2021 --test client/libs/portable/src/homedesk_cache.rs -o /tmp/homedesk-cache
        /tmp/homedesk-cache
        rustc --test client/src/homedesk_async.rs -o /tmp/homedesk-async
        /tmp/homedesk-async
        git diff --check
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
    - windows
    - cli
    - policy
    - unix
    steps:
    - name: Require every current-product check
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |-
        python3 - <<'PY'
        import json, os
        failed = {k:v['result'] for k,v in json.loads(os.environ['RESULTS']).items() if v['result'] != 'success'}
        if failed: raise SystemExit(str(failed))
        PY
  unix:
    name: GUI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: mac-x64
          runner: macos-15-intel
        - target: mac-arm64
          runner: macos-15
        - target: linux-x64
          runner: ubuntu-24.04
        - target: linux-arm64
          runner: ubuntu-24.04-arm
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PYTHONUTF8: '1'
    steps:
    - *id001
    - *id002
    - *id003
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with: *id004
      if: matrix.target != 'linux-arm64'
    - *id005
    - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: ${{ runner.temp }}/vcpkg
        vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
        vcpkgJsonGlob: client/vcpkg.json
        doNotCache: true
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          client/target
          ${{ runner.temp }}/vcpkg/installed
          ${{ runner.temp }}/vcpkg/buildtrees
          ${{ runner.temp }}/vcpkg/downloads
        key: nestlink-native-${{ matrix.target }}-120deac-${{ hashFiles('client/Cargo.lock', 'client/vcpkg.json') }}
    - name: Prepare pinned native toolchain
      run: bash build/ci/setup-unix.sh "${{ matrix.target }}"
    - name: Build shared GUI from current source
      run: python3 build/ci/build-client.py --target "${{ matrix.target }}" --config build/config.toml.example
    - name: Package current Agent and native GUI
      run: |-
        python3 scripts/package-nestlink-unix.py --target "${{ matrix.target }}"
        python3 scripts/collect-native-materials.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nestlink-${{ matrix.target }}
        include-hidden-files: true
        path: |-
          products/*
          material-input/**
        if-no-files-found: error
        retention-days: 30
