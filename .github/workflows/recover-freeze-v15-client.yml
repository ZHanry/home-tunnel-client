name: Apply exact API 1.5 freeze once
on:
  push:
    branches: [codex/windows-v10-1]
    paths: ['.github/workflows/recover-freeze-v15-client.yml']
permissions:
  contents: read
concurrency:
  group: recover-freeze-v15-client
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'ZHanry/home-tunnel-client' && github.ref == 'refs/heads/codex/windows-v10-1' && github.event_name == 'push' && github.event.before == 'd4616525347d443950057e6cf2c83cb7e2c0602a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Reconstruct only reviewed hashes and push this branch without force
        run: python3 -I .recovery/freeze-v15-client/recover.py
