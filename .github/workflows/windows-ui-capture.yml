name: Capture packaged Windows UI
on:
  push:
    branches: [codex/capture-windows-v10]
    paths:
      - '.github/workflows/windows-ui-capture.yml'
      - 'scripts/capture-windows-ui.ps1'
      - 'scripts/wait-windows-ui.mjs'
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Candidate only - successful immutable build run; omit all inputs for historical v10 capture
        type: string
        default: ''
      artifact_id:
        description: Candidate only - candidate-assets artifact ID
        type: string
        default: ''
      artifact_sha256:
        description: Candidate only - full candidate artifact ZIP SHA-256
        type: string
        default: ''
      revision:
        description: Candidate only - exact source SHA
        type: string
        default: ''
      version:
        description: Candidate only - exact package version
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Require complete candidate input identity
        shell: pwsh
        env:
          RUN_ID: ${{ inputs.build_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA: ${{ inputs.artifact_sha256 }}
          REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version }}
        run: |
          $values = @($env:RUN_ID, $env:ARTIFACT_ID, $env:ARTIFACT_SHA, $env:REVISION, $env:VERSION)
          $count = @($values | Where-Object { $_ }).Count
          if ($count -ne 0 -and $count -ne 5) { throw 'Specify all five candidate identity inputs or none for released-v10 capture' }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: inputs.build_run_id != ''
        with:
          version: 11.16.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: inputs.build_run_id != ''
      - name: Verify the original candidate and test its packaged native GUI
        if: inputs.build_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.build_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA: ${{ inputs.artifact_sha256 }}
          HT_WINDOWS_UI_SOURCE_REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version }}
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Packaged UI dependencies failed' }
          python scripts/fetch-client-candidate.py --run-id $env:RUN_ID --artifact-id $env:ARTIFACT_ID --artifact-sha256 $env:ARTIFACT_SHA --revision $env:HT_WINDOWS_UI_SOURCE_REVISION --version $env:VERSION --output outputs/verified-ui-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate provenance verification failed' }
          $directory = Join-Path $PWD 'outputs/verified-ui-candidate/candidate'
          $manifest = Get-Content -Raw (Join-Path $directory 'client-candidate.json') | ConvertFrom-Json
          $name = "HomeTunnel-Windows-$env:VERSION-x64.zip"
          $sha = $manifest.packages.$name.sha256
          .\scripts\capture-windows-ui.ps1 -ArchivePath (Join-Path $directory $name) -ExpectedSHA256 $sha -ExpectedVersion $env:VERSION -Regression
      - name: Capture the genuine historical released v10 GUI
        if: inputs.build_run_id == ''
        shell: pwsh
        run: .\scripts\capture-windows-ui.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-packaged-ui
          path: outputs/windows-ui/*
          if-no-files-found: error
          retention-days: 30
