<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>家庭设备管理台</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body><header><div><span class="eyebrow">家庭内网</span><h1>我的设备</h1></div><button id="logout" hidden>退出</button></header>
<main><p id="message" role="status" aria-live="polite"></p>
<section id="login-panel" class="panel"><h2>连接你的家庭设备</h2><p>输入管理台访问口令。它与远控设备密码相互独立。</p><form id="login-form"><label>访问口令<input name="token" type="password" required minlength="32" maxlength="256" autocomplete="current-password"></label><button>进入管理台</button></form></section>
<div id="workspace" hidden><nav aria-label="管理台页面"><button data-tab="devices" aria-selected="true">设备</button><button data-tab="audit">连接记录</button><button data-tab="settings">设置</button></nav>
<section id="devices-view"><div class="heading"><h2>家庭设备</h2><span id="counts"></span></div><p class="muted">状态每 10 秒刷新。远程开机需要有线网卡及 BIOS 开启网络唤醒。</p><div id="devices" class="grid"></div></section>
<section id="audit-view" hidden><h2>连接记录</h2><form id="filter-form" class="filters"><label>设备<select id="filter-device"><option value="">全部设备</option></select></label><label>开始日期<input id="filter-from" type="date"></label><label>结束日期<input id="filter-to" type="date"></label><button>查询</button><a id="export" href="/api/v1/sessions.csv?limit=10000">导出 CSV</a></form><p class="muted">页面显示最新 100 条；导出最多 10000 条，可按日期分段导出。</p><div class="table-wrap"><table><thead><tr><th>时间</th><th>设备</th><th>对端</th><th>事件</th><th>连接</th><th>时长</th></tr></thead><tbody id="audit"></tbody></table></div></section>
<section id="settings-view" hidden><h2>管理台设置</h2><form id="settings-form" class="panel"><label>允许访问的家庭网段<input name="net_cidr" required placeholder="填写家庭 IPv4 CIDR"></label><label>审计保留天数<input name="retention_days" type="number" min="1" max="3650" required></label><label>新访问口令（留空则保留）<input name="new_token" type="password" minlength="32" maxlength="256" autocomplete="new-password"></label><p class="muted">修改网段可能影响当前访问。修改口令会退出所有会话，需要同步更新客户端的上报配置并重新构建。</p><button>保存设置</button></form></section></div>
<dialog id="edit-dialog"><form id="edit-form"><h2>编辑设备</h2><input name="id" type="hidden"><label>设备名称<input name="name" required maxlength="128"></label><label>房间<input name="room" maxlength="64"></label><label>家庭成员<input name="owner" maxlength="64"></label><label>WOL 有线网卡 MAC<input name="wol_mac" placeholder="留空关闭远程开机"></label><p class="muted">核对 MAC 属于有线网卡；自动上报的地址不一定是可唤醒网卡。</p><div class="actions"><button type="button" id="cancel-edit">取消</button><button>保存</button></div></form></dialog>
</main><footer>直连优先 · 设备状态与远控服务独立运行</footer></body></html>
