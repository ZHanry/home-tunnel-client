[package]
name = "homedesk-console"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
axum = "=0.8.4"
askama = "=0.14.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
uuid = { version = "=1.18.0", features = ["v4"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
