services:
  client:
    build: .
    restart: unless-stopped
    # Linux NAS only. Bind no inbound ports; the client initiates outbound tunnels.
    network_mode: host
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [./data:/data]
    tmpfs: [/tmp:size=32m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700]
    mem_limit: 256m
    pids_limit: 96
